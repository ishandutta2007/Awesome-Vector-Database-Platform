<svg width="100%" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" ry="15"/>
  <text x="50%" y="45%" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle" alignment-baseline="middle">
    Awesome Vector Database Platform
  </text>
  <text x="50%" y="65%" font-family="Arial, sans-serif" font-size="20" fill="#f0f0f0" text-anchor="middle" alignment-baseline="middle">
    Curated List of SaaS Products &amp; Open-Source Projects
  </text>
  <circle cx="100" cy="100" r="10" fill="#fff" opacity="0.5">
    <animate attributeName="cy" values="100;80;100" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="100" r="15" fill="#fff" opacity="0.3">
    <animate attributeName="cy" values="100;120;100" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
